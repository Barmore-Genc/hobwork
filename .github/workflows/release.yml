name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  package:
    needs: check
    if: github.event_name != 'pull_request'
    # x86_64, like colossus. node_modules and the guest image are per architecture.
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C web build
      - run: images/build.sh
        env:
          HOBWORK_IMAGE_ARCH: x86_64
      - name: Version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=${GITHUB_REF_NAME#v}
          else
            version=$(printf %s "$GITHUB_REF_NAME" | tr / -)-${GITHUB_SHA::7}
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: release/package.sh "${{ steps.version.outputs.version }}"
      - if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: hobwork-${{ steps.version.outputs.version }}-linux-x86_64
          path: release/out/
          compression-level: 0
          retention-days: 30
      - if: github.ref_type == 'tag'
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes release/out/*
        env:
          GH_TOKEN: ${{ github.token }}
