name: Hobwork
options:
  bundleIdPrefix: dev.bgenc
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 63QQLP356Q
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # A host name such as hobwork.example.com adds it to Associated Domains, so
    # NFC tag links to https://<host>/nfc/<tag> open the app, and pairing with this
    # host finishes on a link only the app can claim.
    HOBWORK_APPLINKS_HOST: ""
    # With HOBWORK_APPLINKS_HOST, links to hob pages (https://<hob>.<apps host>/...)
    # open the app too. Set it when the apps host is not apps.<HOBWORK_APPLINKS_HOST>,
    # such as apps.example.com next to hobwork.example.com.
    HOBWORK_APPS_HOST: apps.$(HOBWORK_APPLINKS_HOST)
    # The app's entitlements file is picked by name from HOBWORK_APPLINKS_HOST.
    HOBWORK_APPLINKS_FOR_: NO
    HOBWORK_APPLINKS: $(HOBWORK_APPLINKS_FOR_$(HOBWORK_APPLINKS_HOST:identifier):default=YES)
    HOBWORK_APPLINKS_SUFFIX_YES: -AppLinks
    HOBWORK_APPLINKS_SUFFIX_NO: ""
    HOBWORK_APPLINKS_SUFFIX: $(HOBWORK_APPLINKS_SUFFIX_$(HOBWORK_APPLINKS))

targets:
  Hobwork:
    type: application
    supportedDestinations: [iOS, macOS]
    # AlarmKit and Core NFC do not exist on macOS, and Macs have no Health data.
    sources:
      - path: Hobwork
        excludes:
          - Alarms
          - Shared/Alarms
          - Shared/Health
          - Shared/LiveActivities
          - Shared/Hobs
          - Shared/Share
          - Capabilities/NFC
          - Capabilities/Health
          - Capabilities/HomeKit
          - Capabilities/LiveActivities
          - Views/HealthSettings.swift
      - path: Hobwork/Alarms
        destinationFilters: [iOS]
      - path: Hobwork/Shared/Alarms
        destinationFilters: [iOS]
      - path: Hobwork/Shared/Health
        destinationFilters: [iOS]
      - path: Hobwork/Capabilities/NFC
        destinationFilters: [iOS]
      - path: Hobwork/Capabilities/Health
        destinationFilters: [iOS]
      - path: Hobwork/Capabilities/HomeKit
        destinationFilters: [iOS]
      - path: Hobwork/Shared/LiveActivities
        destinationFilters: [iOS]
      - path: Hobwork/Shared/Hobs
        destinationFilters: [iOS]
      - path: Hobwork/Shared/Share
        destinationFilters: [iOS]
      - path: Hobwork/Capabilities/LiveActivities
        destinationFilters: [iOS]
      - path: Hobwork/Views/HealthSettings.swift
        destinationFilters: [iOS]
    info:
      path: Hobwork/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        HobworkAppLinksHost: $(HOBWORK_APPLINKS_HOST)
        # Hosts on the home network are often plain http on a local name or IP.
        # `.localhost` names are what the host's development setup uses; local
        # networking alone does not cover them.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            localhost:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: dev.bgenc.hobwork
            CFBundleURLSchemes: [hobwork]
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        # Relay grant renewals arrive as background pushes.
        UIBackgroundModes: [remote-notification]
        NSAlarmKitUsageDescription: Hobs on your Hobwork host can set alarms and timers on this device.
        NFCReaderUsageDescription: Hobwork reads and writes NFC tags that run your hobs.
        NSCameraUsageDescription: Hobs you open in Hobwork can scan barcodes and take photos when you ask them to.
        # Tag reader sessions that poll ISO 14443 need this list. The NFC Forum
        # NDEF application lets Type 4 tags show up too.
        com.apple.developer.nfc.readersession.iso7816.select-identifiers: [D2760000850101]
        NSHomeKitUsageDescription: Hobs on your Hobwork host can read your Home and move accessories to the right room when you ask them to.
        NSHealthShareUsageDescription: Hobs on your Hobwork host can read the Health data you choose to share.
        # App Store Connect requires it with the HealthKit entitlement, even though the app only reads.
        NSHealthUpdateUsageDescription: Hobwork only reads the Health data you choose to share and does not save data to Health.
    dependencies:
      - target: HobworkNotificationService
      - target: HobworkWidgets
        destinationFilters: [iOS]
      - target: HobworkShare
        destinationFilters: [iOS]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.bgenc.hobwork
        PRODUCT_NAME: Hobwork
        INFOPLIST_KEY_CFBundleDisplayName: Hobwork
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        CODE_SIGN_ENTITLEMENTS: Hobwork/Hobwork$(HOBWORK_APPLINKS_SUFFIX).entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Hobwork/Hobwork-macOS.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # The device driver (`scripts/drive`) and plain http to development hosts on
        # sslip.io exist in Debug builds only.
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) HOBWORK_DRIVER
          HOBWORK_INSECURE_HTTP_DOMAINS: sslip.io
          # The script below edits the processed Info.plist, which another build step produces.
          ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      - name: Allow plain http to development hosts
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        script: |
          [ -n "${HOBWORK_INSECURE_HTTP_DOMAINS:-}" ] || exit 0
          plist="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          for domain in $HOBWORK_INSECURE_HTTP_DOMAINS; do
            key=":NSAppTransportSecurity:NSExceptionDomains:$domain"
            /usr/libexec/PlistBuddy -c "Delete $key" "$plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add $key dict" \
              -c "Add $key:NSIncludesSubdomains bool true" \
              -c "Add $key:NSExceptionAllowsInsecureHTTPLoads bool true" "$plist"
          done

  HobworkNotificationService:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    sources:
      - path: NotificationService
      - path: Hobwork/Shared
        excludes:
          - Alarms
          - Health
          - LiveActivities
          - Hobs
          - Share
      - path: Hobwork/Shared/Alarms
        destinationFilters: [iOS]
      - path: Hobwork/Shared/Health
        destinationFilters: [iOS]
    info:
      path: NotificationService/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.bgenc.hobwork.NotificationService
        PRODUCT_NAME: HobworkNotificationService
        INFOPLIST_KEY_CFBundleDisplayName: Hobwork
        CODE_SIGN_ENTITLEMENTS: NotificationService/NotificationService.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": NotificationService/NotificationService-macOS.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES

  HobworkWidgets:
    type: app-extension
    supportedDestinations: [iOS]
    sources:
      - path: Widgets
      - path: Hobwork/Shared/Alarms/HobworkAlarmMetadata.swift
      - path: Hobwork/Alarms/AlarmControlIntent.swift
      # Live Activities, widgets and controls talk to the host and open sealed pushes.
      - path: Hobwork/Shared/LiveActivities
      - path: Hobwork/Shared/Hobs
      - path: Hobwork/Shared/AppGroup.swift
      - path: Hobwork/Shared/Encoding.swift
      - path: Hobwork/Shared/JSONValue.swift
      - path: Hobwork/Shared/SharedFile.swift
      - path: Hobwork/Shared/Time.swift
      - path: Hobwork/Shared/Host/HostAPI.swift
      - path: Hobwork/Shared/Host/HostProbe.swift
      - path: Hobwork/Shared/Host/Keychain.swift
      - path: Hobwork/Shared/Push/PushStore.swift
      - path: Hobwork/Shared/Push/PushCrypto.swift
      - path: Hobwork/Shared/Push/RelayClient.swift
      - path: Hobwork/Shared/Commands/DeviceMessage.swift
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.bgenc.hobwork.Widgets
        PRODUCT_NAME: HobworkWidgets
        INFOPLIST_KEY_CFBundleDisplayName: Hobwork
        CODE_SIGN_ENTITLEMENTS: Widgets/Widgets.entitlements
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES

  # "Share to Hobwork" in the share sheet.
  HobworkShare:
    type: app-extension
    supportedDestinations: [iOS]
    sources:
      - path: ShareExtension
      - path: Hobwork/Shared/Share
      - path: Hobwork/Shared/Hobs/HobCatalog.swift
      - path: Hobwork/Shared/Hobs/HobLinks.swift
      - path: Hobwork/Shared/AppGroup.swift
      - path: Hobwork/Shared/Encoding.swift
      - path: Hobwork/Shared/JSONValue.swift
      - path: Hobwork/Shared/SharedFile.swift
      - path: Hobwork/Shared/Time.swift
      - path: Hobwork/Shared/Host/HostAPI.swift
      - path: Hobwork/Shared/Host/HostProbe.swift
      - path: Hobwork/Shared/Host/Keychain.swift
      - path: Hobwork/Shared/Push/PushStore.swift
      - path: Hobwork/Shared/Push/PushCrypto.swift
      - path: Hobwork/Shared/Push/RelayClient.swift
      - path: Hobwork/Shared/Commands/DeviceMessage.swift
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsFileWithMaxCount: 10
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsMovieWithMaxCount: 10
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.bgenc.hobwork.Share
        PRODUCT_NAME: HobworkShare
        INFOPLIST_KEY_CFBundleDisplayName: Hobwork
        CODE_SIGN_ENTITLEMENTS: ShareExtension/ShareExtension.entitlements
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES

  HobworkTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: HobworkTests
        excludes: [iOS]
      - path: HobworkTests/iOS
        destinationFilters: [iOS]
    dependencies:
      - target: Hobwork
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.bgenc.hobwork.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Hobwork.app/Hobwork"
        "TEST_HOST[sdk=macosx*]": "$(BUILT_PRODUCTS_DIR)/Hobwork.app/Contents/MacOS/Hobwork"

  HobworkUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS]
    sources:
      - path: HobworkUITests
      - path: Hobwork/Driver/DriverServer.swift
    dependencies:
      - target: Hobwork
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.bgenc.hobwork.uitests
        GENERATE_INFOPLIST_FILE: YES
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) HOBWORK_DRIVER

schemes:
  Hobwork:
    build:
      targets:
        Hobwork: all
        HobworkTests: [test]
    test:
      targets: [HobworkTests]
  # Separate, since testing an iOS-only target would build it for macOS runs too.
  HobworkUITests:
    build:
      targets:
        Hobwork: all
        HobworkUITests: [test]
    test:
      targets: [HobworkUITests]
