name: Hobwork
options:
  bundleIdPrefix: dev.bgenc
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 63QQLP356Q
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # NO signs without Family Controls, which TestFlight and the App Store only
    # accept once Apple approves the distribution entitlement. The app then does
    # not offer Screen Time.
    HOBWORK_FAMILY_CONTROLS: YES
    # A host name such as hobwork.example.com adds it to Associated Domains, so
    # NFC tag links to https://<host>/nfc/<tag> open the app.
    HOBWORK_APPLINKS_HOST: ""
    # Entitlements files are picked by name from the two settings above.
    HOBWORK_FAMILY_CONTROLS_SUFFIX_YES: ""
    HOBWORK_FAMILY_CONTROLS_SUFFIX_NO: -NoFamilyControls
    HOBWORK_FAMILY_CONTROLS_SUFFIX: $(HOBWORK_FAMILY_CONTROLS_SUFFIX_$(HOBWORK_FAMILY_CONTROLS))
    HOBWORK_APPLINKS_FOR_: NO
    HOBWORK_APPLINKS: $(HOBWORK_APPLINKS_FOR_$(HOBWORK_APPLINKS_HOST:identifier):default=YES)
    HOBWORK_APPLINKS_SUFFIX_YES: -AppLinks
    HOBWORK_APPLINKS_SUFFIX_NO: ""
    HOBWORK_APPLINKS_SUFFIX: $(HOBWORK_APPLINKS_SUFFIX_$(HOBWORK_APPLINKS))

targets:
  Hobwork:
    type: application
    supportedDestinations: [iOS, macOS]
    # AlarmKit, Core NFC and ManagedSettings do not exist on macOS, and Macs have
    # no Health data.
    sources:
      - path: Hobwork
        excludes:
          - Shared/Alarms
          - Shared/ScreenTime
          - Shared/Health
          - Capabilities/NFC
          - Capabilities/Health
          - Views/ScreenTimeSettings.swift
          - Views/HealthSettings.swift
      - path: Hobwork/Shared/Alarms
        destinationFilters: [iOS]
      - path: Hobwork/Shared/ScreenTime
        destinationFilters: [iOS]
      - path: Hobwork/Shared/Health
        destinationFilters: [iOS]
      - path: Hobwork/Capabilities/NFC
        destinationFilters: [iOS]
      - path: Hobwork/Capabilities/Health
        destinationFilters: [iOS]
      - path: Hobwork/Views/ScreenTimeSettings.swift
        destinationFilters: [iOS]
      - path: Hobwork/Views/HealthSettings.swift
        destinationFilters: [iOS]
    info:
      path: Hobwork/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        HobworkFamilyControls: $(HOBWORK_FAMILY_CONTROLS)
        # Hosts on the home network are often plain http on a local name or IP.
        # `.localhost` names are what the host's development setup uses; local
        # networking alone does not cover them.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            localhost:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: dev.bgenc.hobwork
            CFBundleURLSchemes: [hobwork]
        NSSupportsLiveActivities: true
        NSAlarmKitUsageDescription: Projects on your Hobwork host can set alarms and timers on this iPhone.
        NFCReaderUsageDescription: Hobwork reads and writes NFC tags that run your projects.
        NSHealthShareUsageDescription: Projects on your Hobwork host can read the Health data you choose to share.
    dependencies:
      - target: HobworkNotificationService
      - target: HobworkDeviceActivityMonitor
        destinationFilters: [iOS]
      - target: HobworkWidgets
        destinationFilters: [iOS]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.bgenc.hobwork
        PRODUCT_NAME: Hobwork
        INFOPLIST_KEY_CFBundleDisplayName: Hobwork
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        CODE_SIGN_ENTITLEMENTS: Hobwork/Hobwork$(HOBWORK_FAMILY_CONTROLS_SUFFIX)$(HOBWORK_APPLINKS_SUFFIX).entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Hobwork/Hobwork-macOS.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  HobworkNotificationService:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    sources:
      - path: NotificationService
      - path: Hobwork/Shared
        excludes:
          - Alarms
          - ScreenTime
          - Health
      - path: Hobwork/Shared/Alarms
        destinationFilters: [iOS]
      - path: Hobwork/Shared/ScreenTime
        destinationFilters: [iOS]
      - path: Hobwork/Shared/Health
        destinationFilters: [iOS]
    info:
      path: NotificationService/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        HobworkFamilyControls: $(HOBWORK_FAMILY_CONTROLS)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.bgenc.hobwork.NotificationService
        PRODUCT_NAME: HobworkNotificationService
        INFOPLIST_KEY_CFBundleDisplayName: Hobwork
        CODE_SIGN_ENTITLEMENTS: NotificationService/NotificationService$(HOBWORK_FAMILY_CONTROLS_SUFFIX).entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": NotificationService/NotificationService-macOS.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES

  HobworkDeviceActivityMonitor:
    type: app-extension
    supportedDestinations: [iOS]
    sources:
      - path: DeviceActivityMonitor
      - path: Hobwork/Shared/AppGroup.swift
      - path: Hobwork/Shared/SharedFile.swift
      - path: Hobwork/Shared/Time.swift
      - path: Hobwork/Shared/ScreenTime/ScreenTimeState.swift
      - path: Hobwork/Shared/ScreenTime/ScreenTimePlan.swift
      - path: Hobwork/Shared/ScreenTime/ScreenTimeSystem.swift
    info:
      path: DeviceActivityMonitor/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).HobworkMonitor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.bgenc.hobwork.DeviceActivityMonitor
        PRODUCT_NAME: HobworkDeviceActivityMonitor
        INFOPLIST_KEY_CFBundleDisplayName: Hobwork
        CODE_SIGN_ENTITLEMENTS: DeviceActivityMonitor/DeviceActivityMonitor$(HOBWORK_FAMILY_CONTROLS_SUFFIX).entitlements
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES

  HobworkWidgets:
    type: app-extension
    supportedDestinations: [iOS]
    sources:
      - path: Widgets
      - path: Hobwork/Shared/Alarms/HobworkAlarmMetadata.swift
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.bgenc.hobwork.Widgets
        PRODUCT_NAME: HobworkWidgets
        INFOPLIST_KEY_CFBundleDisplayName: Hobwork
        CODE_SIGN_ENTITLEMENTS: Widgets/Widgets.entitlements
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES

  HobworkTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: HobworkTests
        excludes: [iOS]
      - path: HobworkTests/iOS
        destinationFilters: [iOS]
    dependencies:
      - target: Hobwork
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.bgenc.hobwork.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Hobwork.app/Hobwork"
        "TEST_HOST[sdk=macosx*]": "$(BUILT_PRODUCTS_DIR)/Hobwork.app/Contents/MacOS/Hobwork"

  HobworkUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS]
    sources:
      - path: HobworkUITests
    dependencies:
      - target: Hobwork
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.bgenc.hobwork.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Hobwork:
    build:
      targets:
        Hobwork: all
        HobworkTests: [test]
    test:
      targets: [HobworkTests]
  # Separate, since testing an iOS-only target would build it for macOS runs too.
  HobworkUITests:
    build:
      targets:
        Hobwork: all
        HobworkUITests: [test]
    test:
      targets: [HobworkUITests]
