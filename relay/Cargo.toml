[package]
name = "hobwork-relay"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = "0.8.9"
base64 = "0.23.1"
ciborium = "0.2.2"
ed25519-dalek = "3.0.0"
hex = "0.4.3"
hmac = "0.13.0"
ipnet = "2.12.2"
p256 = { version = "0.14.0", features = ["ecdsa", "pkcs8", "pem"] }
p384 = { version = "0.14.0", features = ["ecdsa"] }
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "json"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "time", "sync", "net"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
x509-cert = "0.3.0"

[dev-dependencies]
http-body-util = "0.1.5"
rcgen = "0.14.10"
tower = "0.5.3"
